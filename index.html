<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" />
  <title>Axcel NLP Bot</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #111;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }
    .user {
      background-color: #444;
      align-self: flex-end;
    }
    .bot {
      background-color: #222;
      align-self: flex-start;
    }
    form {
      display: flex;
      padding: 1rem;
      background-color: #111;
      border-top: 1px solid #333;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      background-color: #333;
      color: white;
    }
    button {
      margin-left: 0.5rem;
      padding: 0.75rem 1rem;
      border: none;
      background-color: #00aaff;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Axcel</header>
  <div class="chat" id="chat"></div>
  <form id="form">
    <input type="text" id="input" placeholder="بنویس..." required />
    <button type="submit">ارسال</button>
  </form>  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chat = document.getElementById('chat');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      setTimeout(() => {
        const response = generateQuestion(text);
        addMessage(response, 'bot');
      }, 500);
    });

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function generateQuestion(inputText) {
      const keywords = extractKeywords(inputText);
      if (keywords.length === 0) return 'میتونی بیشتر توضیح بدی؟';

      const base = [
        'در مورد',
        'چرا',
        'چه نظری داری درباره',
        'چه احساسی داری نسبت به'
      ];
      const rand = base[Math.floor(Math.random() * base.length)];
      return `${rand} ${keywords[0]}؟`;
    }

    function extractKeywords(text) {
      const stopwords = ['من', 'تو', 'او', 'ما', 'شما', 'آنها', 'هستم', 'هستی', 'هست', 'بود', 'دارم', 'داری', 'داره'];
      const words = text.replace(/[.,!?؟]/g, '').split(' ');
      return words.filter(word => word.length > 2 && !stopwords.includes(word));
    }
  </script></body>
</html>
